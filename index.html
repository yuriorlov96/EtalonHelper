<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>КРУ-помощник</title>

    <style>
        body {
            margin: 0;
            background: #cfcfcf;
            min-height: 100vh;
            /* ← изменено: не фиксированная высота, а минимум весь экран */
            display: flex;
            flex-direction: column;
            /* ← важно: чтобы margin: auto работал вертикально */
            justify-content: center;
            /* ← можно оставить для горизонтального центрирования, если нужно */
            align-items: center;
            font-family: Arial, sans-serif;
        }

        svg {
            background: #e6dccb;
            border: 3px solid #888;
            border-radius: 6px;
            margin: auto;
            /* центрирует по горизонтали, но НЕ вертикально */
        }



        .mmi-panel {
            fill: rgb(0, 104, 83);
            stroke: #fff;
            stroke-width: 4;
            rx: 16;
            ry: 16;
        }

        .mmi-border {
            fill: #fff0;
            stroke: #fff;
            stroke-width: 1;
            rx: 8;
            ry: 8;
        }

        .display-panel {
            fill: #000;
            rx: 4;
            ry: 4;
        }

        .panel {
            fill: #f2f2f2;
            stroke: #999;
            stroke-width: 2;
        }

        .down-panel {
            fill: rgba(0, 104, 83, 0.205);
            stroke: #999;
            stroke-width: 2;
        }

        .scheme-line {
            stroke: #222;
            stroke-width: 6;
            fill: none;

            stroke-linecap: round;
            /* скругление концов */
            stroke-linejoin: round;
            /* скругление углов */
        }

        .arrow {
            fill: #fff;
            stroke: #f00;
            stroke-width: 2;
        }

        .mangen-connector {
            fill: #bbb;
            stroke: #000;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }

        .thin {
            stroke-width: 2;
        }

        .text {
            font-size: 12px;
            fill: #222;
        }

        .text-selector {
            font-size: 10px;
        }

        .text-small {
            font-size: 8px;
            fill: #333;
        }

        .text-legend {
            font-size: 12px;
            fill: #222;
        }

        .text-group {
            font-size: 16px;
            font-weight: bold;
            fill: #444;
        }

        .text-scenario {
            font-size: 16px;
            font-weight: bold;
            font-style: italic;
            fill: #000;
        }

        .text-notification {
            font-size: 14px;
            font-weight: bold;
            fill: #000;
        }

        .text-mmi-display {
            font-size: 12px;
            font-weight: bold;
            fill: #0d0;
        }

        .data-mmi-display {
            font-size: 12px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #0d0;
        }

        .text-mmi-on-off {
            font-size: 6px;
            fill: #fff;
        }

        .text-mmi-button {
            font-size: 8px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #000;
        }

        .text-mangen-black {
            font-size: 7px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #000;
        }

        .text-mangen-white {
            font-size: 7px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #fff;
        }

        .text-mmi-number-button {
            font-size: 10px;
            font-weight: bold;
            fill: #00f;
        }

        .text-mmi-border {
            font-size: 7px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #fff;
        }

        .handle {
            fill: #9e9e9e;
            stroke: #555;
            stroke-width: 2;
        }

        .metal {
            fill: #aaa;
            stroke: #7a5c2e;
            stroke-width: 2;
        }

        .selector_point {
            fill: #f00;
            stroke: #f00;
        }

        /* Кнопка включения */
        .button-on {
            fill: #c62828;
            stroke: #fff;
            stroke-width: 2;
            rx: 8;
            cursor: pointer;
        }

        /* Кнопка выключения */
        .button-off {
            fill: #2e7d32;
            stroke: #fff;
            stroke-width: 2;
            rx: 8;
            cursor: pointer;
        }

        /* Кнопка операции */
        .button-operation {
            fill: #6bbd199f;
            stroke: #222;
            stroke-width: 2;
            rx: 8;
            cursor: pointer;
        }

        /* Кнопка сценария */
        .button-scenario {
            fill: rgba(0, 104, 83, 0.6);
            stroke: #222;
            stroke-width: 2;
            rx: 8;
            cursor: pointer;
        }

        .button-mmi {
            fill: #ddd;
            stroke: #000;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }

        .button-text {
            fill: #fff;
            font-size: 13px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }

        /* Текст навигации */
        .nav-text {
            fill: #fff;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
        }

        .indicator-led {
            stroke: #222;
            stroke-width: 1;
        }

        .movable {
            transition: transform 0.8s ease-in-out;
        }

        /* Разрешенная операция */
        .operation-allowed {
            fill: #6bbd19;
            /* LawnGreen */
            stroke: #000000;
            rx: 8;
            stroke-width: 2;
        }

        /* Запрещенная операция */
        .operation-blocked {
            fill: #e02828;
            /* бледно-красный */
            stroke: #000000;
            rx: 8;
            stroke-width: 2;
            position: relative;
            /* или absolute/fixed — зависит от контекста; важно для z-index */
            z-index: 9999;
            /* достаточно высокое значение, чтобы быть поверх большинства элементов */
            opacity: 0.2;
            pointer-events: none;
        }

        .scenario-back {
            fill: #fff9;
            stroke: #777;
            stroke-width: 2;
            rx: 8;
        }

        .notification-back {
            fill: #fffa;
            rx: 8;
        }

        /* Запрещенная операция без визуального скрытия */
        .operation-blocked-without-visual {
            pointer-events: none;
        }
    </style>
</head>

        // Функция перехода между состояниями согласно матрице переходов
        function goToState(targetState) {

            const opId = transitionMatrix[currentState]?.[targetState];

            if (!opId) {
                console.log(`Переход ${currentState} → ${targetState} запрещён`);
                return;
            }

            const operation = operations[opId];

            if (!operation) {
                console.error(`Операция ${opId} не найдена`);
                return;
            }

            console.log(`Переход ${currentState} → ${targetState}, операция ${opId}`);

            operation(); // 🔥 выполняем действие

            currentState = targetState;
        }

        /* Фнкция перехода между состояниями без анимации */
        function forceState(targetState) {
            if (targetState !== currentState) {
                // Если целевое состояние больше 9, то рукоятка селектора должна быть в гнезде
                // Иначе - на стенде
                if (targetState > 9) {
                    takeOnHandleInmediately();
                }
                else {
                    takeOffHandleInmediately();
                }

                // Если целевое состояние больше 3, то отключить выключатель
                // Иначе - включить выключатель
                if (targetState > 3) {
                    turnOff();
                }
                else {
                    turnOn();
                }

                // Если целевое состояние больше 6, то заблокировать выключатель
                // Иначе - разблокировать выключатель
                if (targetState > 6) {
                    lockBreaker();
                }
                else {
                    unlockBreaker();
                }

                spinSelectorInmediately((currentState - 1) % 3 - (targetState - 1) % 3);

                // Обновляем текущее состояние
                currentState = targetState;

                // Обновляем доступность кнопок
                updateOperationButtons();
            }
        }


        // Функция для получения целевого состояния по операции
        function getTargetStateByOperation(opId) {
            const possible = transitionMatrix[currentState];

            if (!possible) return null;

            for (const [target, operation] of Object.entries(possible)) {
                if (operation === opId) {
                    return Number(target);
                }
            }

            return null;
        }

        // Функция для выполнения операции
        function tryOperation(opId) {

            const targetState = getTargetStateByOperation(opId);

            // Раздел вращения рукоятки селектора:
            const handleOn = document.getElementById("handleOn");
            const handleOff = document.getElementById("handleOff");
            handleOff.classList.add("movable");

            if (!targetState) {
                console.warn(`❌ Операция ${opId} недопустима из состояния ${currentState}`);
                return;
            }

            const operation = operations[opId];

            if (!operation) {
                console.error(`❌ Операция ${opId} не найдена`);
                return;
            }

            console.log(`✅ ${currentState} → ${targetState} (операция ${opId})`);

            operation(); // выполняем действие

            currentState = targetState;

            // Если сценарий не выбран, то показываем текущее состояние и обновляем доступность кнопок
            if (currentScenario === 0) {
                updateNotification();
                updateOperationButtons();
            }



        }

        // Функция для выполнения сценария
        function tryScenario(scId) {
            console.log(`✅ Сценарий #${scId} инициирован`);

            // Скрываем стрелки, если они показаны
            hideArrows();

            // Отключаем кнопку "Предыдущий шаг"
            document.getElementById("prevStep").style.pointerEvents = "none";
            document.getElementById("prevStep").classList.add("operation-blocked");
            currentStep = 1;
            currentScenario = scId;

            hideHiddenMangen(); // скрыть шнур ручного генератора
            setTextMMI("", [""], "", true); // очистить надписи и линии на дисплее MMI


            showNavButtons();

            switch (scId) {
                case 1: // Отключение выключателя
                    stepCount = 2;
                    setTextScenario(`ОТКЛЮЧЕНИЕ ВЫКЛЮЧАТЕЛЯ`);
                    forceState((currentState - 1) % 3 + 1);
                    break;

                case 2: // Аварийное отключение выключателя
                    stepCount = 2;
                    setTextScenario("АВАРИЙНОЕ ОТКЛЮЧЕНИЕ");
                    forceState((currentState - 1) % 3 + 1);
                    break;

                case 3: // Включение выключателя
                    stepCount = 4;
                    setTextScenario("ВКЛЮЧЕНИЕ ВЫКЛЮЧАТЕЛЯ");
                    if (currentState <= 3) {
                        forceState(currentState + 3);
                    }
                    break;

                case 4: // Заземление кабельной линии
                    stepCount = 10;
                    setTextScenario("ЗАЗЕМЛЕНИЕ КЛ");

                    // 1. Перевести схему в состояние 1
                    forceState(1);
                    break;

                case 5: // Ввод кабельной линии в работу
                    stepCount = 9;
                    setTextScenario("ВВОД КЛ В РАБОТУ");

                    // 1. Перевести схему в состояние 3
                    forceState(3);
                    break;

                case 6: // Включение ручным генератором
                    stepCount = 4;
                    setTextScenario("РУЧНОЕ ВКЛЮЧЕНИЕ");
                    // 1. Перевести схему в состояние 4
                    forceState(4);
                    break;

                default:
                    console.warn(`⚠️ Неизвестный сценарий #${scId}`);
            }

            showScenarioBack();

            updateNotification();
            setScenarioNotification([scenarios[currentScenario][currentStep - 1].notification, "Исходная схема:", ...states[currentState].info]);

            // Блокируем кнопки операций
            blockOperationButtons();
            updateNavButtons();
        }

        /*
         * Функция для перевода селектора в новое положение без анимации.
         * Селектор поворачивается на угол, равный 90° * input.
         * input может принимать значения от -2 до 2
         */
        function spinSelectorInmediately(input) {

            const selector = document.getElementById("selector_pos");

            // Вычисляем новый угол
            const delta = 90 * input;

            // Устанавливаем центр вращения
            selector.style.transformOrigin = "150px 300px";

            // Отключаем анимацию
            selector.style.transition = "none";

            // Форсируем применение стилей
            void selector.offsetWidth;

            // Обновляем глобальный угол
            selectorAngle = (selectorAngle || 0) + delta;

            // Применяем поворот
            selector.style.transform = `rotate(${selectorAngle}deg)`;
        }

        function showPointer(target, delay = 0, duration = 3000) {

            const pointer = document.getElementById("pointer");
            if (!pointer) {
                console.warn("⚠️ Элемент #pointer не найден");
                return;
            }

            // Сбросим предыдущий таймер
            if (pointer.clearTimeoutId) {
                clearTimeout(pointer.clearTimeoutId);
            }

            let x, y;

            if (typeof target === "object" && target.tagName) { // элемент DOM/SVG
                const center = getElementCenter(target);
                if (!center) {
                    console.error("❌ Не удалось вычислить центр элемента:", target);
                    return;
                }
                x = center.x;
                y = center.y;
            } else if (typeof target === "number") { // координаты
                x = target;
                y = duration;
                duration = arguments.length === 3 ? arguments[2] : 3000;
            } else {
                console.error("❌ Неверный тип target в showPointer():", typeof target);
                return;
            }

            // ❗ ВАЖНО: добавляем таймер на задержку
            pointer.clearTimeoutId = setTimeout(() => {
                // 1. Переместить указатель
                pointer.setAttribute("transform", `translate(${x}, ${y})`);
                // 2. Показать
                pointer.style.opacity = "1";
                // 3. Заблокировать все кнопки на 3 секунды
                //blockAllButtonsTemporarily(duration);

                // 3. Скрыть через duration
                setTimeout(() => {
                    pointer.setAttribute("transform", "translate(-1000, -1000)");
                    pointer.style.opacity = "0";
                    pointer.clearTimeoutId = null;
                }, duration);
            }, delay);
        }

            runShowPointer(scenarios[currentScenario][currentStep - 1].showPointer);
            runBlockButtons(scenarios[currentScenario][currentStep - 1].blockButtons);
            runShowArrows(scenarios[currentScenario][currentStep - 1].showArrow);

            blockOperationButtons();
            updateNotification();
        }

        function navNext() {
            hideArrows();
            setTextMMI("", [""], "", true); // скрыть текст и линии на панели MMI

            currentStep++;
            console.log(`Шаг ${currentStep} / ${stepCount}`);
            setScenarioNotification(scenarios[currentScenario][currentStep - 1].notification);
            blockOperationButtons();
            updateNavButtons();
            runOperation(scenarios[currentScenario][currentStep - 1].operation);
            runShowPointer(scenarios[currentScenario][currentStep - 1].showPointer);
            runBlockButtons(scenarios[currentScenario][currentStep - 1].blockButtons);
            runShowArrows(scenarios[currentScenario][currentStep - 1].showArrow);
            updateNotification();
        }


        function navFinish() {
            hideArrows();
            deblockOperationButtons(); // Разблокируем кнопки операций
            updateOperationButtons(); // Обновляем доступность кнопок в соответствии с матрицей переходов
            hideNavButtons(); // Скрываем кнопки навигации
            setTextScenario("");
            setScenarioNotification([``]); // Скрываем уведомление

            currentStep = 0;
            stepCount = 0;
            currentScenario = 0;

            hideHiddenMangen(); // Скрываем рукоятку генератора
            setTextMMI("", [""], "", true); // скрыть текст и линии на панели MMI

            hideScenarioBack();

            updateNotification();
        }

        /* Функция блокировки всех кнопок операций.
        Предназначена для блокировки кнопок, когда
        активен какой-либо сценарий */
        function blockOperationButtons() {
            for (let opId = 1; opId <= 9; opId++) {

                const btn = document.getElementById(`op${opId}`);

                if (!btn)
                    continue;
                if (opId < 3) {
                    btn.classList.remove(
                        "operation-allowed",
                        "operation-blocked"
                    );
                    btn.classList.add("operation-blocked-without-visual");
                }
                else {
                    btn.classList.remove(
                        "operation-allowed",
                        "operation-blocked"
                    );
                    btn.classList.add("operation-blocked");
                }
            }
        }

        /* Функция разблокировки всех кнопок операций.
        Предназначена для разблокировки кнопок, когда
        завершается сценарий */
        function deblockOperationButtons() {
            for (let opId = 1; opId <= 9; opId++) {

                const btn = document.getElementById(`op${opId}`);

                if (!btn)
                    continue;

                btn.classList.remove(
                    "operation-blocked",
                    "operation-blocked-without-visual"
                );
            }
        }

        function runOperation(operation) {
            if (typeof operation === "function") {
                operation();
            } else if (operation !== null && operation !== undefined) {
                console.warn("⚠️ operation не является функцией:", operation);
            }
        }

        function runShowPointer(operation) {
            if (typeof operation === "function") {
                operation();
            } else if (operation !== null && operation !== undefined) {
                console.warn("⚠️ showPointer не является функцией:", operation);
            }
        }

        function runBlockButtons(operation) {
            if (typeof operation === "function") {
                operation();
            } else if (operation !== null && operation !== undefined) {
                console.warn("⚠️ showPointer не является функцией:", operation);
            }
        }

        function runShowArrows(operation) {
            if (typeof operation === "function") {
                operation();
            } else if (operation !== null && operation !== undefined) {
                console.warn("⚠️ showPointer не является функцией:", operation);
            }
        }

        /* Функция обновления доступности кнопок навигации */
        function updateNavButtons() {
            document.getElementById("prevStep").style.pointerEvents = "auto";
            document.getElementById("prevStep").classList.remove("operation-blocked");
            document.getElementById("nextStep").style.pointerEvents = "auto";
            document.getElementById("nextStep").classList.remove("operation-blocked");
            if (currentStep == 1) {
                document.getElementById("prevStep").style.pointerEvents = "none";
                document.getElementById("prevStep").classList.add("operation-blocked");
            }
            if (currentStep == stepCount && currentStep != 0) {
                document.getElementById("nextStep").style.pointerEvents = "none";
                document.getElementById("nextStep").classList.add("operation-blocked");
            }
        }

        /* Функция обновления доступности кнопок операций
         * Если операция доступна в текущем состоянии (по матрице переходов)
         * то кнопка становится доступной, иначе — заблокированной */
        function updateOperationButtons() {

            console.log("Текущее состояние:", currentState);

            // Сбрасываем все кнопки
            for (let opId = 3; opId <= 9; opId++) {

                const btn = document.getElementById(`op${opId}`);

                if (!btn)
                    continue;

                btn.classList.remove(
                    "operation-allowed",
                    "operation-blocked"
                );

                const targetState = getTargetStateByOperation(opId);

                if (targetState) {
                    btn.classList.add("operation-allowed");
                }
                else {
                    btn.classList.add("operation-blocked");
                }
            }
        }

        /**
         * Блокирует все кнопки на заданное время и восстанавливает их исходное состояние
         * @param {number} duration — время блокировки в миллисекундах (например, 2000 = 2 сек)
         */
        function blockAllButtonsTemporarily(duration = 10000) {

            if (duration == 0) return;

            // 1. Блокируем панели (как и раньше)
            const panels = ["commandPanel", "scenarioPanel", "navPanel", "mmiPanel"];
            panels.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.pointerEvents = "none";
            });

            // 2. Блокируем кнопки навигации (только prevStep и nextStep)
            const navButtons = ["prevStep", "nextStep"];
            const savedNavPointerEvents = {};

            navButtons.forEach(id => {
                const btn = document.getElementById(id);
                if (btn) {
                    // Сохраняем исходное состояние
                    savedNavPointerEvents[id] = btn.style.pointerEvents;
                    // Блокируем явно (чтобы переопределить родительский pointer-events: none)
                    btn.style.pointerEvents = "none";
                }
            });

            console.log(`⚡ Заблокировано панели и кнопки: ${navButtons.join(", ")}`);

            // 3. Разблокировка через duration
            setTimeout(() => {
                // Разблокируем панели
                panels.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.pointerEvents = "auto";
                });

                // Восстанавливаем исходное состояние кнопок prevStep и nextStep
                navButtons.forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) {
                        const saved = savedNavPointerEvents[id];
                        btn.style.pointerEvents = saved || "auto"; // восстанавливаем
                    }
                });

                console.log(`✅ Разблокировано (${duration} мс)`);
            }, duration);
        }

        // Возвращает объект {x, y} — координаты центра SVG-элемента (в локальной системе координат SVG)
        function getElementCenter(element) {
            if (!element) return null;

            // Попытка 1: использовать getBBox() — работает для <rect>, <circle>, <g> и т.д.
            try {
                const bbox = element.getBBox();
                return {
                    x: bbox.x + bbox.width / 2,
                    y: bbox.y + bbox.height / 2
                };
            } catch (e) {
                console.warn("⚠️ getBBox() не поддерживается или элемент невидимый:", element);
            }

            // Попытка 2: для <g> с <rect> внутри — попробуем найти первый <rect>
            const rect = element.querySelector("rect");
            if (rect) {
                const rectBBox = rect.getBBox();
                return {
                    x: rectBBox.x + rectBBox.width / 2,
                    y: rectBBox.y + rectBBox.height / 2
                };
            }

            return { x: 0, y: 0 }; // fallback
        }

        function getCurrentDateTime() {
            const now = new Date();

            // Массив с сокращенными названиями месяцев на русском
            const months = [
                'Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн',
                'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'
            ];

            // Получаем компоненты даты
            const month = months[now.getMonth()];
            const day = String(now.getDate()).padStart(2, '0');
            const year = now.getFullYear();

            // Получаем компоненты времени
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const milliseconds = String(now.getMilliseconds()).padStart(3, '0');

            // Собираем строку в нужном формате
            return `${month}/${day}/${year} ${hours}:${minutes}:${seconds}.${milliseconds}`;
        }

        hideTestButtons();
        hideArrows();
        updateOperationButtons();
        hideHiddenMangen();
        hideScenarioBack();
        setTextMMI("", [""], "", true);
        updateNotification();
    </script>
