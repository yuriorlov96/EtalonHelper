<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <!-- 
      1. АДАПТАЦИЯ ПОД МОБИЛЬНЫЕ УСТРОЙСТВА:
      - width=device-width: ширина области просмотра равна ширине экрана устройства.
      - initial-scale=1.0: начальный масштаб 1:1 (без отдаления).
      - maximum-scale=1.0, user-scalable=no: запрет масштабирования щипком (pinch-to-zoom),
        чтобы при нажатиях и перетаскивании деталей экран не зумился случайно.
      - viewport-fit=cover: растягивает интерфейс на весь экран, включая зоны под вырезами
        (челка/Dynamic Island на iPhone) и жестовой полосой внизу.
    -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Цвет строки состояния браузера на смартфонах (Safari / Chrome Mobile) -->
    <meta name="theme-color" content="#1f2421">

    <title>КРУ Etalon</title>

    <style>
        /* 
          2. БАЗОВЫЙ СБРОС (RESET):
          box-sizing: border-box — размеры элементов включают padding и border.
          -webkit-tap-highlight-color: transparent — убирает серый/синий квадрат подсветки
          при клике/тапе на мобильных экранах (делает интерфейс похожим на нативное приложение).
          user-select: none — отключает случайное выделение текста синей рамкой при долгом нажатии.
        */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 
          3. ПОЛНОЭКРАННОЕ ОКНО БЕЗ ПРОКРУТКИ:
          100dvh (Dynamic Viewport Height) — ключевое свойство для мобилок. В отличие от 100vh, 
          оно динамически учитывает скрытие и появление адресной строки в мобильных браузерах.
          overflow: hidden — гарантирует жесткий запрет скролла (окно стоит как влитое).
          touch-action: none — блокирует системные жесты браузера (тягу страницы вниз для обновления).
        */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #1f2421;
            /* Внешний темный фон (виден на ПК по бокам контейнера) */
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

       /* 
          4. МОБИЛЬНЫЙ КОНТЕЙНЕР (РАБОЧАЯ ОБЛАСТЬ):
          - aspect-ratio: удерживает пропорции телефона 1:2 при любом зуме на ПК.
          - width / height: масштабируются синхронно до предельной границы окна (meet).
          - container-type: size: позволяет кнопкам масштабироваться от размера контейнера.
        */
        #app {
            aspect-ratio: 440 / 880;
            width: min(440px, calc(100dvh * (440 / 880)));
            height: min(880px, 100dvh, calc(100vw * (880 / 440)));
            max-width: 100vw;
            max-height: 100dvh;
            background: #e6dccb;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.6);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            container-type: size; /* Для синхронного масштабирования HTML-кнопок */
        }

        /* 
          5. КОНТЕЙНЕР ДЛЯ MMI (ВЕРХНЯЯ ТРЕТЬ ЭКРАНА):
          height: 33% — занимает ровно треть высоты смартфона.
          display: flex — центрирует SVG-панель внутри своей области.
        */
        .mmi-section {
            width: 100%;
            height: 50%;
            flex: 0 0 50%; /* Запрещает секции сжиматься в пользу кнопок */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px 6px;
            position: relative;
            z-index: 10;
        }

        .bottom-section {
            width: 100%;
            height: 50%;
            flex: 0 0 50%; /* Строго держит вторую половину */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 
          6. СТИЛИ ЭЛЕМЕНТОВ MMI (ИЗ ОРИГИНАЛЬНОГО ФАЙЛА):
        */
        .mmi-panel {
            fill: rgb(0, 104, 83);
            stroke: #ffffff;
            stroke-width: 4;
            rx: 16;
            ry: 16;
        }

        .mmi-border {
            fill: #fff0;
            stroke: #ffffff;
            stroke-width: 1;
            rx: 8;
            ry: 8;
        }

        .display-panel {
            fill: #000000;
            rx: 4;
            ry: 4;
        }

        .text-mmi-display {
            font-size: 12px;
            font-weight: bold;
            fill: #00dd00;
        }

        .data-mmi-display {
            font-size: 12px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #00dd00;
        }

        .text-mmi-border {
            font-size: 7px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #ffffff;
        }

        .text-mmi-on-off {
            font-size: 6px;
            fill: #ffffff;
        }

        /* Кнопка включения ВВ (I) */
        .button-on {
            fill: #c62828;
            stroke: #ffffff;
            stroke-width: 2;
            rx: 8;
            cursor: pointer;
        }

        /* Кнопка отключения ВВ (O) */
        .button-off {
            fill: #2e7d32;
            stroke: #ffffff;
            stroke-width: 2;
            rx: 8;
            cursor: pointer;
        }

        .button-text {
            fill: #ffffff;
            font-size: 13px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }

        .indicator-led {
            stroke: #222222;
            stroke-width: 1;
        }

        /* Серые сервисные кнопки MMI */
        .button-mmi {
            fill: #dddddd;
            stroke: #000000;
            stroke-width: 1;
            rx: 4;
            ry: 4;
            cursor: pointer;
        }

        /* Плавная анимация нажатия кнопки MMI */
        .button-on,
        .button-off,
        .button-mmi {
            transition: opacity 0.2s ease;
        }

        .button-on:active,
        .button-off:active,
        .button-mmi:active {
            opacity: 0.3;
            /* степень прозрачности в момент касания */
        }

        .text-mmi-button {
            font-size: 8px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #000000;
            pointer-events: none;
        }

        .text-mmi-number-button {
            font-size: 10px;
            font-weight: bold;
            fill: #0000ff;
            pointer-events: none;
        }

        /* Разъем ручного генератора */
        .mangen-connector {
            fill: #bbb;
            stroke: #000;
            stroke-width: 1;
            rx: 4;
            ry: 4;
        }
        /* Текст таблички ручного генератора */
        .text-mangen-black {
            font-size: 7px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #000000;
        }

        .text-mangen-white {
            font-size: 7px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: #ffffff;
        }

        /* Аккуратный размер надписи внутри рамки разъема */
        #generatorHarting .text {
            font-size: 9.5px;
        }

        /* 
          7. НИЖНЯЯ ПОЛОВИНА ЭКРАНА:
          height: 50% — занимает ровно нижнюю половину экрана.
          justify-content: space-between — мнемосхема прижата к верху,
          а блок для трёх будущих кнопок автоматически прижат к низу.
        */
        .bottom-section {
            width: 100%;
            height: 50%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        .scheme-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: hidden;
            /* Прижимает мнемосхему к верху нижней половины */
        }

        .scheme-wrapper svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 
          9. НИЖНЯЯ ПАНЕЛЬ И КНОПКИ НАВИГАЦИИ:
          margin-top: auto — гарантированно прижимает блок к самому низу экрана.
        */
        .bottom-nav-container {
            width: 100%;
            padding: 0 10px 10px 10px;
            /* Отступы по бокам и снизу экрана */
            margin-top: auto;
        }

        /* 
          Обновленный стиль нижней навигации (полупрозрачный)
        */
        .bottom-nav-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.88); /* Полупрозрачный фон */
            backdrop-filter: blur(8px);            /* Эффект матового стекла */
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid #9ca3af;
            border-radius: 14px;
            padding: 6px;
            display: flex;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* 
          ВСПЛЫВАЮЩИЕ ПАНЕЛИ РАЗДЕЛОВ:
          - position: absolute + bottom: 0: прижаты к нижней границе экрана.
          - transform: translateY(120%): по умолчанию спрятаны вниз за экран.
          - pointer-events: none: чтобы в скрытом состоянии не перехватывали нажатия.
        */
        .menu-drawer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 0 10px 10px 10px; /* Такие же отступы, как у bottom-nav-container */
            z-index: 50;
            transform: translateY(120%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
            pointer-events: none;
        }

        /* Класс для показа панели (будем добавлять через JS) */
        .menu-drawer.open {
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Карточка панели — высота адаптируется под любое количество кнопок */
        .menu-drawer-card {
            width: 100%;
            height: auto; /* Высота строго по содержимому */
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #9ca3af;
            border-radius: 14px;
            padding: 8px;
            display: flex;
            flex-direction: column; /* Кнопки строго в один столбец */
            gap: 6px;               /* Отступ между кнопками */
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
        }

        /* Кнопки внутри всплывающих панелей */
        .drawer-btn {
            width: 100%;
            min-height: clamp(28px, 4.3cqh, 38px);
            padding: 4px 8px;
            border: 1px solid #4b4b4b;
            border-radius: 8px;
            font-size: clamp(9px, 2.7cqw, 12px);
            font-weight: bold;
            background: #ffffff;
            color: #1f2421;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .drawer-btn:active {
            opacity: 0.5;
            background: #f3f4f6;
            transform: scale(0.98);
        }

        /* Кнопка "Скрыть" (акцентная для быстрого закрытия) */
        .drawer-btn-close {
            background: #fee2e2;
            color: #991b1b;
            border-color: #4b4b4b;
            margin-top: 2px;
        }

        .drawer-btn-close:active {
            background: #fecaca;
        }

        /* Кнопки вкладок внутри рамки */
        .nav-btn {
            flex: 1;
            height: clamp(30px, 5cqh, 44px); /* Масштабируется по высоте экрана */
            border: 1px solid transparent;
            border-radius: 9px;
            font-size: clamp(9px, 2.7cqw, 12px); /* Масштабируется по ширине экрана */
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #006853;
            color: #ffffff;
            border-color: #004d3d;
        }


        /* Эффект нажатия на телефоне */
        .nav-btn:active {
            transform: scale(0.97);
            filter: brightness(0.95);
        }

        /* 
          8. СТИЛИ ЭЛЕМЕНТОВ МНЕМОСХЕМЫ:
        */
        /* Белая картичка-подложка для мнемосхемы */
        .scheme-card-bg {
            fill: #fff;
            stroke: #9ca3af;
            stroke-width: 2;
            rx: 14;
            ry: 14;
        }

        .scheme-line {
            stroke: #222222;
            stroke-width: 6;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .arrow {
            fill: #ffffff;
            stroke: #ff0000;
            stroke-width: 2;
        }

        .text {
            font-size: 12px;
            fill: #222222;
            font-weight: bold;
        }

        .text-selector {
            font-size: 10px;
            font-weight: bold;
        }

        .text-small {
            font-size: 8px;
            fill: #333333;
            font-weight: bold;
        }

        .metal {
            fill: #aaaaaa;
            stroke: #7a5c2e;
            stroke-width: 2;
        }

        .selector_point {
            fill: #ff0000;
            stroke: #ff0000;
        }

        .movable {
            transition: transform 0.8s ease-in-out;
        }
    </style>
</head>

<body>

    <!-- Главный контейнер приложения, куда пошагово будем помещать элементы -->
    <main id="app">
        <!-- ======================================================== -->
        <!-- 1. ВЕРХНЯЯ ПОЛОВИНА: БЛОК MMI (БЕЗ ИСПОЛЬЗОВАНИЯ SCALE)      -->
        <!-- viewBox="15 15 470 470" автоматически вписывает панель   -->
        <!-- ======================================================== -->
        <section class="mmi-section">
            <svg viewBox="15 15 470 470" preserveAspectRatio="xMidYMin meet">
                <g id="mmiPanel">
                    <!-- Корпус блока MMI -->
                    <rect x="20" y="20" width="460" height="350" class="mmi-panel" />

                    <!-- Дисплей терминала -->
                    <rect x="50" y="40" width="400" height="90" class="display-panel" />

                    <!-- Разделительные линии дисплея -->
                    <g id="mmi-line">
                        <line x1="55" y1="57" x2="445" y2="57" stroke="#00cc00" stroke-width="2" />
                        <line x1="55" y1="115" x2="445" y2="115" stroke="#00cc00" stroke-width="2" />
                    </g>

                    <!-- Строки дисплея для вывода текста через JS -->
                    <text id="mmi-display-first-line-text" x="55" y="52" class="text-mmi-display"></text>
                    <text id="mmi-display-text" x="55" y="70" class="text-mmi-display"></text>
                    <text id="mmi-display-date" x="250" y="124" class="data-mmi-display"></text>

                    <!-- Рамки функциональных блоков -->
                    <rect x="50" y="160" width="190" height="90" class="mmi-border" />
                    <rect x="255" y="160" width="205" height="45" class="mmi-border" />

                    <text x="145" y="155" class="text-mmi-border">УПРАВЛЕНИЕ ВВ</text>
                    <text x="357" y="155" class="text-mmi-border">ПРОСМОТР ЖУРНАЛОВ</text>

                    <text x="95" y="185" class="text-mmi-on-off">ВКЛЮЧЕНО</text>
                    <text x="170" y="185" class="text-mmi-on-off">ОТКЛЮЧЕНО</text>

                    <!-- Кнопка включения ВВ (op1) -->
                    <g id="btnMMIOn" onclick="tryOperation(1)" style="cursor:pointer;">
                        <rect id="op1" x="85" y="190" width="40" height="40" class="button-on" />
                        <text x="105" y="210" class="button-text">I</text>
                    </g>
                    <!-- Индикатор ВКЛ -->
                    <circle id="indicatorOn" cx="90" cy="183" r="3" fill="#ffffff" class="indicator-led" />

                    <!-- Кнопка отключения ВВ (op2) -->
                    <g id="btnMMIOff" onclick="tryOperation(2)" style="cursor:pointer;">
                        <rect id="op2" x="165" y="190" width="40" height="40" class="button-off" />
                        <text x="185" y="210" class="button-text">O</text>
                    </g>
                    <!-- Индикатор ОТКЛ -->
                    <circle id="indicatorOff" cx="165" cy="183" r="3" fill="#ff0000" class="indicator-led" />

                    <!-- Кнопки навигации MMI (стрелки, отмена, ввод) -->
                    <g id="mmiNavButtons">
                        <rect x="50" y="265" width="55" height="30" class="button-mmi" />
                        <text x="77" y="280" class="text-mmi-button">ОТМЕНА</text>

                        <rect x="115" y="265" width="55" height="30" class="button-mmi" />
                        <text x="142" y="280" class="text-mmi-button">▲</text>

                        <rect x="180" y="265" width="55" height="30" class="button-mmi" />
                        <text x="207" y="280" class="text-mmi-button">ВВОД</text>

                        <rect x="50" y="310" width="55" height="30" class="button-mmi" />
                        <text x="77" y="325" class="text-mmi-button">◄</text>

                        <rect x="115" y="310" width="55" height="30" class="button-mmi" />
                        <text x="142" y="325" class="text-mmi-button">▼</text>
                        <rect x="180" y="310" width="55" height="30" class="button-mmi" />
                        <text x="207" y="325" class="text-mmi-button">►</text>
                    </g>

                    <!-- Кнопки журналов MMI -->
                    <g id="mmiJournalButtons">
                        <rect x="265" y="170" width="55" height="30" class="button-mmi" />
                        <text x="292" y="185" class="text-mmi-button">СОБЫТИЯ</text>
                        <text x="270" y="180" class="text-mmi-number-button">1</text>

                        <rect id="malfunButton" x="330" y="170" width="55" height="30" class="button-mmi" />
                        <text x="360" y="180" class="text-mmi-button">
                            <tspan x="360" dy="0">НЕИСПР.</tspan>
                            <tspan x="360" dy="1.2em">ПРЕДУПР.</tspan>
                        </text>
                        <text x="335" y="180" class="text-mmi-number-button">2</text>

                        <rect id="measButton" x="395" y="170" width="55" height="30" class="button-mmi" />
                        <text x="422" y="185" class="text-mmi-button">ИЗМЕРЕНИЯ</text>
                        <text x="400" y="180" class="text-mmi-number-button">3</text>
                    </g>

                    <!-- Кнопки функций РЗА -->
                    <g id="mmiRzaButtons">
                        <rect x="265" y="220" width="55" height="30" class="button-mmi" />
                        <text x="292" y="235" class="text-mmi-button">АПВ</text>
                        <text x="270" y="230" class="text-mmi-number-button">4</text>

                        <rect x="330" y="220" width="55" height="30" class="button-mmi" />
                        <text x="357" y="235" class="text-mmi-button">АВР</text>
                        <text x="335" y="230" class="text-mmi-number-button">5</text>

                        <rect x="395" y="220" width="55" height="30" class="button-mmi" />
                        <text x="422" y="235" class="text-mmi-button">ОЗЗ</text>
                        <text x="400" y="230" class="text-mmi-number-button">6</text>

                        <rect x="265" y="265" width="55" height="30" class="button-mmi" />
                        <text x="292" y="280" class="text-mmi-button">ЗЗЗ</text>
                        <text x="270" y="275" class="text-mmi-number-button">7</text>

                        <rect x="330" y="265" width="55" height="30" class="button-mmi" />
                        <text x="357" y="280" class="text-mmi-button">КВИТ.</text>
                        <text x="335" y="275" class="text-mmi-number-button">8</text>

                        <rect x="395" y="265" width="55" height="30" class="button-mmi" />
                        <text x="422" y="280" class="text-mmi-button">ЛЗШ</text>
                        <text x="400" y="275" class="text-mmi-number-button">9</text>

                        <rect x="265" y="310" width="55" height="30" class="button-mmi" />
                        <text x="292" y="325" class="text-mmi-button">МЕСТН.</text>

                        <rect x="330" y="310" width="55" height="30" class="button-mmi" />
                        <text x="335" y="320" class="text-mmi-number-button">0</text>

                        <rect x="395" y="310" width="55" height="30" class="button-mmi" />
                        <text x="422" y="325" class="text-mmi-button">ГРУППА</text>
                        <text x="400" y="320" class="text-mmi-number-button">.</text>
                    </g>

                    <!-- Светодиодные индикаторы статусов -->
                    <g id="mmiLeds">
                        <!-- Над кнопкой 1 -->
                        <circle cx="270" cy="165" r="3" fill="#ffffff" class="indicator-led" />
                        <text x="277" y="167" class="text-mmi-on-off">События</text>
                        <!-- Над кнопкой 2 -->
                        <circle cx="335" cy="165" r="3" fill="#ffffff" class="indicator-led" />
                        <text x="342" y="167" class="text-mmi-on-off">Неисправн.</text>
                        <!-- Над кнопкой 3 -->

    <script>
        // Закрыть все всплывающие панели
        function closeAllDrawers() {
            document.querySelectorAll('.menu-drawer').forEach(drawer => {
                drawer.classList.remove('open');
            });
        }

        // Открыть выбранную панель (с возможностью свернуть при повторном клике)
        function openDrawer(drawerId) {
            const targetDrawer = document.getElementById(drawerId);
            if (!targetDrawer) return;

            const isOpen = targetDrawer.classList.contains('open');

            // Сначала закрываем любую открытую панель
            closeAllDrawers();

            // Если панель была закрыта — открываем её
            if (!isOpen) {
                targetDrawer.classList.add('open');
            }
        }

        // Навешиваем клики на нижние кнопки навигации
        document.getElementById('btnTabScenarios').addEventListener('click', () => {
            openDrawer('drawerScenarios');
        });

        document.getElementById('btnTabControl').addEventListener('click', () => {
            openDrawer('drawerControl');
        });

        document.getElementById('btnTabLocks').addEventListener('click', () => {
            openDrawer('drawerLocks');
        });

        // Навешиваем закрытие на все кнопки "Скрыть"
        document.querySelectorAll('.drawer-btn-close').forEach(btn => {
            btn.addEventListener('click', closeAllDrawers);
        });
    </script>
